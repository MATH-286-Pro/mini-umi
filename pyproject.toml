[project]
name = "umi-mini"
version = "0.1.0"
description = "Universal Manipulation Interface"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.10,<2",
    "aiofiles==23.2.*",
    "aiohttp==3.9.*",
    "atomics==1.0.2",
    "av>=15,<16",
    "boto3==1.33.*",
    "cython==0.29.*",
    "diffusers>=0.27.2,<0.36",
    "dill==0.3.7",
    "einops>=0.8,<0.9",
    "fastcrc==0.2.*",
    "huggingface-hub>=0.34.2,<0.36",
    "hydra-core==1.3.4",
    "imagecodecs>=2025.3.30",
    "ipykernel==6.23.*",
    "k3d==2.15.*",
    "lmdb==1.4.*",
    "matplotlib>=3.9,<4",
    "lerobot==0.4.3",
    "numba>=0.61,<0.63",
    "numcodecs>=0.15,<0.16",
    "numpy>=2.0,<2.3",
    "onnx>=1.16,<2",
    "onnxruntime>=1.18,<2",
    "opencv-python-headless>=4.9,<4.13",
    "pandas>=2.2,<2.4",
    "pyarrow>=16,<22",
    "pynput>=1.7.7,<1.9",
    "pyexiftool==0.5",
    "pyyaml==6.0.*",
    "scikit-fda==0.9.*",
    "scikit-video==1.1.*",
    "scipy>=1.13,<1.16",
    "threadpoolctl==3.2.*",
    "timm==0.9.7",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "tqdm>=4.66,<5",
    "ur-rtde==1.5.6",
    "v4l2py==2.2",
    "wandb>=0.24,<0.25",
    "setuptools>=71,<81",
    "zarr>=2.18,<3",
]

[tool.uv]
package = false
required-version = ">=0.12.0"
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
